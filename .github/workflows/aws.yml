name: Deploy ms-dpia-agents

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ms-dpia-agents
  cancel-in-progress: false

env:
  DEPLOYMENT_VERSION: ms202612agents
  DOCKER_IMAGE_NAME: ms202612agents

jobs:
  deploy-to-cluster:
    if: github.event.repository.name == 'ms-dpia-agents'
    environment: ms-dpia-agents-production
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ec2-54-234-169-22.compute-1.amazonaws.com
      HOST_PORT: "8302"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve lowercase Docker Hub namespace
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE_NAMESPACE=${REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push independent image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:latest

      - name: Deploy only ms202612agents
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            CONTAINER='${{ env.DEPLOYMENT_VERSION }}'
            IMAGE='docker.io/${{ env.IMAGE_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}'
            test "$CONTAINER" = 'ms202612agents'
            test '${{ env.DOCKER_IMAGE_NAME }}' = 'ms202612agents'
            test '${{ env.HOST_PORT }}' = '8302'
            command -v python3 >/dev/null
            command -v ss >/dev/null
            docker network inspect red_app >/dev/null
            test -r /home/ubuntu/.env
            test -r /home/ubuntu/google_oauth_credentials.json

            # Refuse to replace a same-named container owned by another project.
            RUNNING=false
            if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              test "$(docker inspect --format '{{ index .Config.Labels "com.dpia.service" }}' "$CONTAINER")" = 'ms-dpia-agents'
              RUNNING=$(docker inspect --format '{{.State.Running}}' "$CONTAINER")
            fi
            # Check all other containers, including wildcard/IP-specific bindings.
            for id in $(docker ps -aq); do
              test "$(docker inspect --format '{{.Name}}' "$id")" = "/$CONTAINER" && continue
              docker inspect --format '{{json .HostConfig.PortBindings}}' "$id" |
                python3 -c 'import json,sys; bindings=json.load(sys.stdin) or {}; sys.exit(1 if any(b.get("HostPort")=="8302" for group in bindings.values() for b in (group or [])) else 0)'
            done
            if test "$RUNNING" != true; then
              test -z "$(ss -H -ltn 'sport = :8302')"
              python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",8302)); s.close()'
            fi
            # Read-only files are available before Python starts. No credential output.
            set -- --mount type=bind,src=/home/ubuntu/.env,dst=/src/.env,readonly
            for file in client_secrets.json credentials_module.json upload_to_gcs.json pruebasheetpython.json google_oauth_credentials.json; do
              if test -f "/home/ubuntu/$file"; then
                test -r "/home/ubuntu/$file"
                set -- "$@" --mount "type=bind,src=/home/ubuntu/$file,dst=/src/utils/$file,readonly"
              fi
            done
            docker pull "$IMAGE"
            if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              docker stop "$CONTAINER"
              docker rm "$CONTAINER"
            fi
            # Recheck immediately before publishing; Docker also rejects port races.
            test -z "$(ss -H -ltn 'sport = :8302')"
            python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",8302)); s.close()'
            docker run -d --name "$CONTAINER" --label com.dpia.service=ms-dpia-agents \
              --network red_app -p 127.0.0.1:8302:8302 --restart unless-stopped \
              -e HOST=0.0.0.0 -e PORT=8302 -e FLASK_ENV=production \
              -e AGENTS_TRUSTED_PROXY_IPS=172.18.0.1 \
              "$@" "$IMAGE"
            # Silence diagnostics: configuration exceptions may contain credentials.
            if ! docker exec "$CONTAINER" python -c 'import config; assert config.PORT==8302; assert config.GOOGLE_CLIENT_ID.strip()' >/dev/null 2>&1; then
              echo 'Configuration check failed; inspect configuration securely.'
              exit 1
            fi
            # A TCP probe avoids HTTP hooks that can write activity logs to MySQL.
            for attempt in $(seq 1 30); do
              if docker exec "$CONTAINER" python -c 'import socket; s=socket.create_connection(("127.0.0.1",8302),timeout=2); s.close()' >/dev/null 2>&1; then
                echo 'ms-dpia-agents listening on port 8302'
                exit 0
              fi
              sleep 2
            done
            echo 'ms-dpia-agents did not start on port 8302'
            exit 1
