name: Deploy ms-dpia-agents

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ms-dpia-agents
  cancel-in-progress: false

env:
  DEPLOYMENT_VERSION: ms202612agents
  DOCKER_IMAGE_NAME: ms202612agents

jobs:
  deploy-to-cluster:
    if: github.event.repository.name == 'ms-dpia-agents'
    environment: ms-dpia-agents-production
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ec2-54-234-169-22.compute-1.amazonaws.com
      HOST_PORT: "8302"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve lowercase Docker Hub namespace
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE_NAMESPACE=${REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push independent image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:latest

      - name: Deploy only ms202612agents
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            CONTAINER='${{ env.DEPLOYMENT_VERSION }}'
            IMAGE='docker.io/${{ env.IMAGE_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}'
            PREVIOUS_IMAGE=''
            test "$CONTAINER" = 'ms202612agents'
            test '${{ env.DOCKER_IMAGE_NAME }}' = 'ms202612agents'
            test '${{ env.HOST_PORT }}' = '8302'
            command -v python3 >/dev/null
            command -v ss >/dev/null
            docker network inspect red_app >/dev/null
            test -r /home/ubuntu/.env
            test -r /home/ubuntu/google_oauth_credentials.json

            if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              test "$(docker inspect --format '{{ index .Config.Labels "com.dpia.service" }}' "$CONTAINER")" = 'ms-dpia-agents'
              PREVIOUS_IMAGE=$(docker inspect --format '{{.Image}}' "$CONTAINER")
            fi

            for id in $(docker ps -aq); do
              if [ "$(docker inspect --format '{{.Name}}' "$id")" = "/$CONTAINER" ]; then
                continue
              fi
              docker inspect --format '{{json .HostConfig.PortBindings}}' "$id" | python3 -c 'import json,sys; bindings=json.load(sys.stdin) or {}; sys.exit(1 if any(b.get("HostPort")=="8302" for group in bindings.values() for b in (group or [])) else 0)'
            done

            set -- --mount type=bind,src=/home/ubuntu/.env,dst=/src/.env,readonly
            for file in client_secrets.json credentials_module.json upload_to_gcs.json pruebasheetpython.json google_oauth_credentials.json; do
              if test -f "/home/ubuntu/$file"; then
                test -r "/home/ubuntu/$file"
                set -- "$@" --mount "type=bind,src=/home/ubuntu/$file,dst=/src/utils/$file,readonly"
              fi
            done

            docker pull "$IMAGE"

            wait_for_port() {
              attempt=1
              while [ "$attempt" -le 30 ]; do
                if python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",8302)); s.close()' 2>/dev/null; then
                  return 0
                fi
                echo "Waiting for port 8302 ($attempt/30)"
                sleep 1
                attempt=$((attempt + 1))
              done
              return 1
            }

            start_container() {
              target_image="$1"
              shift
              docker run -d --name "$CONTAINER" --label com.dpia.service=ms-dpia-agents --network red_app -p 127.0.0.1:8302:8302 --restart unless-stopped -e HOST=0.0.0.0 -e PORT=8302 -e FLASK_ENV=production -e AGENTS_TRUSTED_PROXY_IPS=172.18.0.1 "$@" "$target_image"
            }

            check_container() {
              if ! docker exec "$CONTAINER" python -c 'import config; assert config.PORT==8302; assert config.GOOGLE_CLIENT_ID.strip()' >/dev/null 2>&1; then
                return 1
              fi
              for attempt in $(seq 1 30); do
                if docker exec "$CONTAINER" python -c 'import socket; s=socket.create_connection(("127.0.0.1",8302),timeout=2); s.close()' >/dev/null 2>&1; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              docker stop "$CONTAINER"
              docker rm "$CONTAINER"
            fi

            if ! wait_for_port; then
              echo 'ERROR: Port 8302 remains occupied.'
              exit 1
            fi

            if start_container "$IMAGE" "$@" && check_container; then
              echo 'SUCCESS: ms-dpia-agents listening on port 8302'
              # Workers are deployed in the next independent step, after the web health check.
              exit 0
            fi

            echo 'ERROR: New version failed startup checks.'
            if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              docker rm -f "$CONTAINER"
            fi

            if [ -n "$PREVIOUS_IMAGE" ]; then
              echo 'Attempting rollback.'
              if wait_for_port && start_container "$PREVIOUS_IMAGE" "$@" && check_container; then
                echo 'ROLLBACK SUCCESS: Previous version restored.'
              else
                echo 'ROLLBACK FAILED: Manual investigation required.'
              fi
            else
              echo 'No previous container image available for rollback.'
            fi
            exit 1

      - name: Deploy isolated DPIA engine processes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            IMAGE='docker.io/${{ env.IMAGE_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}'
            WEB='ms202612agents'
            test "$(docker inspect --format '{{ index .Config.Labels "com.dpia.service" }}' "$WEB")" = 'ms-dpia-agents'
            test "$(docker inspect --format '{{.Config.Image}}' "$WEB")" = "$IMAGE"
            docker network inspect red_app >/dev/null
            test -r /home/ubuntu/.env

            # Use the exact same read-only configuration mounts as the web container.
            set -- --mount type=bind,src=/home/ubuntu/.env,dst=/src/.env,readonly
            for file in client_secrets.json credentials_module.json upload_to_gcs.json pruebasheetpython.json google_oauth_credentials.json; do
              if test -f "/home/ubuntu/$file"; then
                test -r "/home/ubuntu/$file"
                set -- "$@" --mount "type=bind,src=/home/ubuntu/$file,dst=/src/utils/$file,readonly"
              fi
            done

            # These names are exclusive to DPIA Agents. Never stop or remove any other container.
            deploy_process() {
              name="$1"
              shift
              if docker container inspect "$name" >/dev/null 2>&1; then
                test "$(docker inspect --format '{{ index .Config.Labels "com.dpia.service" }}' "$name")" = 'ms-dpia-agents'
                docker rm -f "$name"
              fi
              docker run -d --name "$name" \
                --label com.dpia.service=ms-dpia-agents \
                --network red_app --restart unless-stopped \
                -e HOST=0.0.0.0 -e PORT=8302 -e FLASK_ENV=production \
                -e AGENTS_TRUSTED_PROXY_IPS=172.18.0.1 \
                "$@" "$IMAGE" flask --app app "$COMMAND" --watch --interval 5 $EXTRA
            }

            COMMAND=agent-dispatch EXTRA=''
            deploy_process ms202612agents-dispatcher "$@"
            COMMAND=agent-outbox EXTRA=''
            deploy_process ms202612agents-outbox "$@"
            COMMAND=agent-worker EXTRA='--local-test --capability local-test'
            deploy_process ms202612agents-worker-local "$@"
            COMMAND=agent-worker EXTRA='--providers --capability search'
            deploy_process ms202612agents-worker-scraper "$@"

            sleep 8
            for name in ms202612agents-dispatcher ms202612agents-outbox ms202612agents-worker-local ms202612agents-worker-scraper; do
              test "$(docker inspect --format '{{.State.Running}}' "$name")" = true
              test "$(docker inspect --format '{{.RestartCount}}' "$name")" = 0
              echo "RUNNING: $name"
            done
